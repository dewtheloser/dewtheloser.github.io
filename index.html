
<script>
const sourcePhrase = ["DEW THE", "LOSER"];
const targetPhrase = ["SEE THE", "WORLD"];

const lineOne = document.getElementById("line-one");
const lineTwo = document.getElementById("line-two");
const hero = document.getElementById("hero");
const heading = document.getElementById("anagram");

const reduceMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve, ms));

function buildPhrase(first, second) {
  function makeLine(text, container) {
    container.replaceChildren();

    return [...text].map(char => {
      const slot = document.createElement("span");
      slot.className = "letter-slot";

      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = char === " " ? "\u00a0" : char;

      if (char === " ") {
        letter.classList.add("space");
      }

      slot.appendChild(letter);
      container.appendChild(slot);

      return { char, slot, letter };
    });
  }

  return [
    ...makeLine(first, lineOne),
    ...makeLine(second, lineTwo)
  ];
}

function center(rect) {
  return {
    x: rect.left + rect.width / 2,
    y: rect.top + rect.height / 2
  };
}

async function runAnagram() {
  // Always create the starting phrase first.
  const original = buildPhrase(
    sourcePhrase[0],
    sourcePhrase[1]
  );

  heading.setAttribute("aria-label", "See the world");

  if (reduceMotion) {
    buildPhrase(targetPhrase[0], targetPhrase[1]);
    return;
  }

  await sleep(1500);

  // Record the starting positions before changing the layout.
  const starts = original.map(item => ({
    item,
    rect: item.letter.getBoundingClientRect()
  }));

  // Build the final layout, initially hiding its letters.
  const destination = buildPhrase(
    targetPhrase[0],
    targetPhrase[1]
  );

  destination.forEach(item => {
    item.letter.style.opacity = "0";
  });

  // Force the browser to calculate the destination layout.
  heading.getBoundingClientRect();

  // Match letters by character, using each destination once.
  const used = new Set();
  const moves = [];

  starts.forEach(start => {
    if (start.item.char === " ") return;

    const index = destination.findIndex(
      (end, i) =>
        !used.has(i) &&
        end.char !== " " &&
        end.char === start.item.char
    );

    if (index === -1) return;

    used.add(index);

    const end = destination[index];
    const from = center(start.rect);
    const to = center(end.letter.getBoundingClientRect());

    moves.push({
      start,
      end,
      dx: to.x - from.x,
      dy: to.y - from.y
    });
  });

  // Create independent overlays so letters can travel freely.
  const overlays = moves.map(move => {
    const sourceLetter = move.start.item.letter;
    const rect = sourceLetter.getBoundingClientRect();
    const computed = getComputedStyle(sourceLetter);

    const overlay = sourceLetter.cloneNode(true);

    Object.assign(overlay.style, {
      position: "fixed",
      left: `${rect.left}px`,
      top: `${rect.top}px`,
      width: `${rect.width}px`,
      height: `${rect.height}px`,
      margin: "0",
      zIndex: "1000",
      pointerEvents: "none",
      transform: "translate(0, 0)",
      transition: "none",
      fontFamily: computed.fontFamily,
      fontSize: computed.fontSize,
      fontWeight: computed.fontWeight,
      letterSpacing: computed.letterSpacing,
      lineHeight: computed.lineHeight,
      color: "var(--accent)"
    });

    document.body.appendChild(overlay);

    return { ...move, overlay };
  });

  hero.classList.add("is-animating");
  document.body.offsetHeight;

  // Reveal destination letters and animate matching letters.
  const animations = overlays.map((move, i) => {
    const { dx, dy } = move;
    const direction = i % 2 === 0 ? -1 : 1;
    const arc = direction * (30 + (i % 4) * 12);
    const tilt = direction * 3;

    move.end.letter.style.opacity = "1";

    const animation = move.overlay.animate(
      [
        {
          transform: "translate(0, 0) rotate(0deg)",
          opacity: 1,
          offset: 0
        },
        {
          transform:
            `translate(${dx * 0.5}px, ${dy * 0.5 + arc}px) ` +
            `rotate(${tilt}deg)`,
          opacity: 1,
          offset: 0.5
        },
        {
          transform:
            `translate(${dx}px, ${dy}px) rotate(0deg)`,
          opacity: 1,
          offset: 1
        }
      ],
      {
        duration: 1400 + (i % 3) * 100,
        delay: (i % 5) * 35,
        easing: "cubic-bezier(.22,.75,.18,1)",
        fill: "forwards"
      }
    );

    return animation.finished.catch(() => {});
  });

  await Promise.all(animations);

  // Remove temporary overlays and reveal the complete final phrase.
  overlays.forEach(move => move.overlay.remove());

  hero.classList.remove("is-animating");

  buildPhrase(targetPhrase[0], targetPhrase[1]);
  heading.setAttribute("aria-label", "See the world");
}

runAnagram().catch(error => {
  console.error("Anagram animation failed:", error);

  buildPhrase(targetPhrase[0], targetPhrase[1]);
  heading.setAttribute("aria-label", "See the world");
});
</script>
