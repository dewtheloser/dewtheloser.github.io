
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Admin — SEE THE WORLD</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0; padding: 30px 20px;
      background: #10110f; color: #f3f0e8;
      font: 15px Arial, sans-serif;
    }
    main { max-width: 600px; margin: 40px auto; }
    h1 { font-size: 30px; }
    p { color: #a4a49a; }
    input, button {
      display: block; width: 100%; box-sizing: border-box;
      padding: 13px; margin: 12px 0;
      border-radius: 5px; font: inherit;
    }
    input { background: #191a17; color: white; border: 1px solid #555; }
    button {
      background: #d3e0ad; color: #10110f;
      border: 0; cursor: pointer; font-weight: bold;
    }
    button:disabled { opacity: .5; cursor: wait; }
    img { max-width: 100%; max-height: 300px; object-fit: contain; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>SEE THE WORLD.</h1>
  <p>Private gallery management</p>

  <form id="login">
    <h2>Admin login</h2>
    <input id="email" type="email" placeholder="Your email" required>
    <input id="password" type="password" placeholder="Your password" required>
    <button>Log in</button>
  </form>

  <section id="manager" hidden>
    <h2>Upload a photo</h2>
    <form id="upload">
      <input id="file" type="file"
        accept="image/webp,image/jpeg,image/png" required>
      <img id="preview" hidden alt="Selected image preview">
      <input id="caption" maxlength="150"
        placeholder="Photo caption" required>
      <input id="location" maxlength="150"
        placeholder="Location (optional)">
      <button id="publish">Publish to gallery</button>
    </form>
    <button id="logout" type="button">Log out</button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
  // Replace these with your own Supabase project details.
  const SUPABASE_URL = "https://ddoidhdmbzvdnihysulj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_El35FFjl02a87rBYo8IzMg_lNRJFDL3";

  const db = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  const loginForm = document.querySelector("#login");
  const uploadForm = document.querySelector("#upload");
  const manager = document.querySelector("#manager");
  const status = document.querySelector("#status");
  const fileInput = document.querySelector("#file");
  const preview = document.querySelector("#preview");
  const publishButton = document.querySelector("#publish");

  function message(text) {
    status.textContent = text;
  }

  async function refreshSession() {
    const { data, error } = await db.auth.getSession();
    if (error) {
      message(error.message);
      return;
    }

    const user = data.session?.user;
    const ownerId = "f34e5a07-d7ca-4464-84a7-92583b1cc449";

    // Client-side convenience only; database policies enforce security.
    const isOwner = !!user && user.id === ownerId;
    loginForm.hidden = isOwner;
    manager.hidden = !isOwner;

    if (user && !isOwner) {
      await db.auth.signOut();
      message("This account is not authorized.");
    }
  }

  loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    message("Signing in...");

    const { error } = await db.auth.signInWithPassword({
      email: document.querySelector("#email").value,
      password: document.querySelector("#password").value
    });

    if (error) {
      message(error.message);
      return;
    }

    await refreshSession();
    if (!manager.hidden) message("You are logged in.");
  });

  document.querySelector("#logout").addEventListener("click", async () => {
    await db.auth.signOut();
    await refreshSession();
    message("Logged out.");
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    preview.hidden = !file;

    if (file) {
      preview.src = URL.createObjectURL(file);
    }
  });

  uploadForm.addEventListener("submit", async event => {
    event.preventDefault();

    const file = fileInput.files[0];
    if (!file) return;

    const allowedTypes = [
      "image/webp", "image/jpeg", "image/png"
    ];

    if (!allowedTypes.includes(file.type)) {
      message("Choose a WebP, JPEG, or PNG image.");
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      message("Please choose an image smaller than 5 MB.");
      return;
    }

    publishButton.disabled = true;
    message("Uploading image...");

    let uploadedPath;

    try {
      const { data: sessionData } = await db.auth.getSession();
      const user = sessionData.session?.user;

      if (!user || user.id !== "f34e5a07-d7ca-4464-84a7-92583b1cc449") {
        throw new Error("Please log in with the authorized account.");
      }

      const extension = {
        "image/webp": "webp",
        "image/jpeg": "jpg",
        "image/png": "png"
      }[file.type];

      const path = `${crypto.randomUUID()}.${extension}`;

      const { error: uploadError } = await db.storage
        .from("gallery")
        .upload(path, file, {
          contentType: file.type,
          cacheControl: "3600",
          upsert: false
        });

      if (uploadError) throw uploadError;
      uploadedPath = path;

      const { data: urlData } = db.storage
        .from("gallery")
        .getPublicUrl(path);

      const { error: insertError } = await db
        .from("photos")
        .insert({
          image_url: urlData.publicUrl,
          caption: document.querySelector("#caption").value.trim(),
          location: document.querySelector("#location").value.trim()
        });

      if (insertError) throw insertError;

      uploadForm.reset();
      preview.hidden = true;
      preview.removeAttribute("src");
      message("Photo published successfully!");

    } catch (error) {
      // Remove an uploaded file if its database record failed.
      if (uploadedPath) {
        const { error: cleanupError } = await db.storage
          .from("gallery")
          .remove([uploadedPath]);

        if (cleanupError) {
          console.error("Cleanup failed:", cleanupError);
        }
      }

      message("Upload failed: " + error.message);
    } finally {
      publishButton.disabled = false;
    }
  });

  db.auth.onAuthStateChange(() => {
    refreshSession();
  });

  refreshSession();
</script>
</body>
</html>
