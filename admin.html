
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>Gallery Admin — SEE THE WORLD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10110f;
      --panel: #191a17;
      --text: #f3f0e8;
      --muted: #a4a49a;
      --accent: #d3e0ad;
      --border: #55574f;
      --danger: #ffaaa0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 20px;
      background: var(--bg);
      color: var(--text);
      font: 15px Arial, sans-serif;
    }

    main {
      max-width: 600px;
      margin: 40px auto;
    }

    h1 { font-size: 30px; letter-spacing: 1px; }
    h2 { margin-top: 28px; }

    p { color: var(--muted); line-height: 1.6; }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 5px;
      font: inherit;
    }

    input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    input:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      background: var(--accent);
      color: var(--bg);
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .password-wrap {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .password-wrap input {
      min-width: 0;
      flex: 1;
    }

    .password-wrap button {
      width: 95px;
      flex-shrink: 0;
      margin: 10px 0;
      padding: 10px;
    }

    .secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin: 15px 0;
      border-radius: 5px;
    }

    #status {
      overflow-wrap: anywhere;
      min-height: 24px;
    }

    #status.error { color: var(--danger); }
    #status.success { color: var(--accent); }

    [hidden] { display: none !important; }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>
<main>
  <h1>SEE THE WORLD.</h1>
  <p>Private gallery management</p>

  <!-- LOGIN -->
  <section id="loginSection">
    <h2>Admin login</h2>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Your admin email"
        required
      >

      <label for="password">Password</label>
      <div class="password-wrap">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Your password"
          required
        >

        <button
          id="togglePassword"
          class="secondary"
          type="button"
          aria-controls="password"
          aria-pressed="false"
        >Show</button>
      </div>

      <button id="loginButton" type="submit">Log in</button>
    </form>

    <p class="hint">
      Only the authorized administrator can access the gallery manager.
    </p>
  </section>

  <!-- ADMIN PANEL -->
  <section id="manager" hidden>
    <h2>Upload a photo</h2>

    <form id="uploadForm">
      <label for="file">Choose an image</label>
      <input
        id="file"
        type="file"
        accept="image/webp,image/jpeg,image/png"
        required
      >

      <img id="preview" hidden alt="Selected image preview">

      <label for="caption">Photo caption</label>
      <input
        id="caption"
        type="text"
        maxlength="150"
        placeholder="Photo caption"
        required
      >

      <label for="location">Location (optional)</label>
      <input
        id="location"
        type="text"
        maxlength="150"
        placeholder="Location"
      >

      <button id="publishButton" type="submit">
        Publish to gallery
      </button>
    </form>

    <button id="logoutButton" class="secondary" type="button">
      Log out
    </button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";

  // 1. Replace these with your actual Supabase project details.
  const SUPABASE_URL = "https://ddoidhdmbzvdnihysulj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_El35FFjl02a87rBYo8IzMg_lNRJFDL3";

  // Your authorized admin user's UUID from Supabase Authentication.
  const OWNER_ID = "f34e5a07-d7ca-4464-84a7-92583b1cc449";

  const BUCKET = "gallery";
  const MAX_FILE_SIZE = 5 * 1024 * 1024;

  if (
    !window.supabase ||
    SUPABASE_URL.includes("YOUR_") ||
    SUPABASE_KEY.includes("YOUR_")
  ) {
    document.querySelector("#status").textContent =
      "Setup required: enter your Supabase URL and public key.";
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = (selector) => document.querySelector(selector);

  const loginSection = $("#loginSection");
  const loginForm = $("#loginForm");
  const loginButton = $("#loginButton");
  const manager = $("#manager");
  const uploadForm = $("#uploadForm");
  const publishButton = $("#publishButton");
  const passwordInput = $("#password");
  const togglePassword = $("#togglePassword");
  const fileInput = $("#file");
  const preview = $("#preview");
  const status = $("#status");

  let busy = false;
  let previewUrl = null;

  function message(text, type = "") {
    status.textContent = text;
    status.className = type;
  }

  function showPassword(visible) {
    passwordInput.type = visible ? "text" : "password";
    togglePassword.textContent = visible ? "Hide" : "Show";
    togglePassword.setAttribute("aria-pressed", String(visible));
  }

  togglePassword.addEventListener("click", () => {
    showPassword(passwordInput.type === "password");
  });

    const user = data.session?.user;
    const ownerId = "f34e5a07-d7ca-4464-84a7-92583b1cc449";

    if (error) throw error;

    const user = data.user;

    if (!user || user.id !== OWNER_ID) {
      return null;
    }

    return user;
  }

  async function refreshSession() {
    try {
      const user = await getAuthorizedUser();

      if (user) {
        loginSection.hidden = true;
        manager.hidden = false;
        passwordInput.value = "";
        showPassword(false);
      } else {
        manager.hidden = true;
        loginSection.hidden = false;
      }
    } catch (error) {
      manager.hidden = true;
      loginSection.hidden = false;
      message("Could not verify your session. Please log in again.", "error");
    }
  }

  // 2. Authenticate first, then verify the account is the admin.
  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (busy) return;
    busy = true;
    loginButton.disabled = true;
    message("Signing in...");

    try {
      const email = $("#email").value.trim();
      const password = passwordInput.value;

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      const user = await getAuthorizedUser();

      if (!user) {
        await db.auth.signOut();
        throw new Error("This account is not authorized as the gallery admin.");
      }

      loginSection.hidden = true;
      manager.hidden = false;
      passwordInput.value = "";
      showPassword(false);
      message("Login successful. You can now upload photos.", "success");
    } catch (error) {
      message(error.message || "Login failed.", "error");
    } finally {
      busy = false;
      loginButton.disabled = false;
    }
  });

  // 3. Preview the selected image.
  fileInput.addEventListener("change", () => {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    const file = fileInput.files[0];
    preview.hidden = !file;
    preview.removeAttribute("src");

    if (file) {
      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
    }
  });

  // 4. Verify the current user again before every upload.
  uploadForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (busy) return;

    const file = fileInput.files[0];
    if (!file) {
      message("Please select an image.", "error");
      return;
    }

    const allowedTypes = [
      "image/webp",
      "image/jpeg",
      "image/png"
    ];

    if (!allowedTypes.includes(file.type)) {
      message("Choose a WebP, JPEG, or PNG image.", "error");
      return;
    }

    if (file.size > MAX_FILE_SIZE) {
      message("Please choose an image smaller than 5 MB.", "error");
      return;
    }

    const caption = $("#caption").value.trim();
    const location = $("#location").value.trim();

    if (!caption) {
      message("Please enter a photo caption.", "error");
      return;
    }

    busy = true;
    publishButton.disabled = true;
    message("Verifying admin access...");

    let uploadedPath = null;

    try {
      const user = await getAuthorizedUser();

      if (!user || user.id !== "f34e5a07-d7ca-4464-84a7-92583b1cc449") {
        throw new Error("Please log in with the authorized account.");
      }

      const extensionByType = {
        "image/webp": "webp",
        "image/jpeg": "jpg",
        "image/png": "png"
      };

      const extension = extensionByType[file.type];
      const path = `${user.id}/${crypto.randomUUID()}.${extension}`;

      message("Uploading image...");

      const { error: uploadError } = await db.storage
        .from(BUCKET)
        .upload(path, file, {
          contentType: file.type,
          cacheControl: "3600",
          upsert: false
        });

      if (uploadError) throw uploadError;
      uploadedPath = path;

      const { data: urlData } = db.storage
        .from(BUCKET)
        .getPublicUrl(path);

      message("Saving photo details...");

      const { error: insertError } = await db
        .from("photos")
        .insert({
          image_url: urlData.publicUrl,
          caption,
          location: location || null
        });

      if (insertError) throw insertError;

      uploadForm.reset();
      preview.hidden = true;
      preview.removeAttribute("src");

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      message("Photo published successfully!", "success");
    } catch (error) {
      // Roll back the uploaded file if saving the database row fails.
      if (uploadedPath) {
        const { error: cleanupError } = await db.storage
          .from(BUCKET)
          .remove([uploadedPath]);

        if (cleanupError) {
          console.error("Uploaded file cleanup failed:", cleanupError);
        }
      }

      message("Upload failed: " + (error.message || "Unknown error"), "error");
    } finally {
      busy = false;
      publishButton.disabled = false;
    }
  });

  // 5. Log out.
  $("#logoutButton").addEventListener("click", async () => {
    if (busy) return;

    const { error } = await db.auth.signOut();

    if (error) {
      message("Logout failed: " + error.message, "error");
      return;
    }

    loginForm.reset();
    uploadForm.reset();

    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    preview.hidden = true;
    preview.removeAttribute("src");
    showPassword(false);

    manager.hidden = true;
    loginSection.hidden = false;
    message("You have been logged out.", "success");
  });

  // 6. Restore a valid session on page load.
  db.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_IN" || event === "SIGNED_OUT") {
      // Avoid awaiting Supabase calls directly inside this callback.
      setTimeout(() => refreshSession(), 0);
    }
  });

  refreshSession();
})();
</script>
</body>
</html>
