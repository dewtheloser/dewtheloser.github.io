
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>Gallery Admin — SEE THE WORLD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10110f;
      --panel: #191a17;
      --text: #f3f0e8;
      --muted: #a4a49a;
      --accent: #d3e0ad;
      --border: #55574f;
      --danger: #ffaaa0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: var(--bg);
      color: var(--text);
      font: 15px Arial, sans-serif;
    }

    main {
      max-width: 600px;
      margin: 40px auto;
    }

    h1 {
      font-size: 30px;
      letter-spacing: 1px;
    }

    h2 {
      margin-top: 28px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input,
    button {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 5px;
      font: inherit;
    }

    input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    input:focus,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      background: var(--accent);
      color: var(--bg);
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .password-wrap {
      display: flex;
      align-items: stretch;
      gap: 8px;
      width: 100%;
    }

    .password-wrap input {
      flex: 1;
      min-width: 0;
    }

    .password-wrap button {
      flex: 0 0 88px;
      width: 88px;
      margin: 10px 0;
      padding: 10px 5px;
    }

    select {
      display: block; width: 100%; padding: 13px; margin: 10px 0;
      border-radius: 5px; font: inherit;
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
    }
    select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    details { margin: 10px 0; }
    summary { cursor: pointer; color: var(--accent); padding: 6px 0; }

    .photo-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
    }
    .photo-row img { max-height: 180px; margin: 0 0 8px; }
    .btns { display: flex; gap: 8px; }
    .btns button { margin: 10px 0 0; }
    .danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

    .secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin: 15px 0;
      border-radius: 5px;
    }

    #status {
      min-height: 24px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #status.error {
      color: var(--danger);
    }

    #status.success {
      color: var(--accent);
    }

    #status.info {
      color: var(--muted);
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
<main>
  <h1>SEE THE WORLD.</h1>
  <p>Private gallery management</p>

  <!-- LOGIN -->
  <section id="loginSection">
    <h2>Admin login</h2>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Your admin email"
        required
      >

      <label for="password">Password</label>

      <div class="password-wrap">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Your password"
          required
        >

        <button
          id="togglePassword"
          class="secondary"
          type="button"
          aria-controls="password"
          aria-pressed="false"
        >Show</button>
      </div>

      <button id="loginButton" type="submit">
        Log in
      </button>
    </form>

    <p class="hint">
      Only the authorized administrator can access the gallery manager.
    </p>
  </section>

  <!-- ADMIN MANAGER -->
  <section id="manager" hidden>
    <h2>Upload a photo</h2>

    <form id="uploadForm">
      <label for="file">Choose an image</label>
      <input
        id="file"
        type="file"
        accept="image/webp,image/jpeg,image/png"
        multiple
        required
      >

      <img id="preview" alt="Selected image preview" hidden>

      <label for="album">Album (optional)</label>
      <select id="album"><option value="">No album</option></select>

      <details>
        <summary>＋ Create a new album</summary>
        <input id="newAlbum" type="text" maxlength="80" placeholder="Album title">
        <input id="newAlbumDesc" type="text" maxlength="200" placeholder="Short description (optional)">
        <button id="createAlbum" class="secondary" type="button">Create album</button>
      </details>

      <label for="caption">Photo caption</label>
      <input
        id="caption"
        type="text"
        maxlength="150"
        placeholder="Photo caption (optional when uploading several)"
      >

      <label for="location">Location (optional)</label>
      <input
        id="location"
        type="text"
        maxlength="150"
        placeholder="Location"
      >

      <button id="publishButton" type="submit">
        Publish to gallery
      </button>
    </form>

    <h2>Manage photos</h2>

    <label for="filterAlbum">Show</label>
    <select id="filterAlbum"><option value="">All photos</option></select>

    <div id="photoList"></div>

    <button id="logoutButton" class="secondary" type="button">
      Log out
    </button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";

  // ==========================================
  // CONFIGURATION — UPDATE THESE THREE VALUES
  // ==========================================

  const SUPABASE_URL = "https://ddoidhdmbzvdnihysulj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_El35FFjl02a87rBYo8IzMg_lNRJFDL3";
  const OWNER_ID = "bbed1825-b481-469b-8b53-5f331534a374";

  const BUCKET = "gallery";
  const MAX_FILE_SIZE = 5 * 1024 * 1024;

  // ==========================================
  // PAGE ELEMENTS
  // ==========================================

  const $ = (selector) => document.querySelector(selector);

  const loginSection = $("#loginSection");
  const loginForm = $("#loginForm");
  const loginButton = $("#loginButton");
  const manager = $("#manager");
  const uploadForm = $("#uploadForm");
  const publishButton = $("#publishButton");
  const passwordInput = $("#password");
  const togglePassword = $("#togglePassword");
  const fileInput = $("#file");
  const preview = $("#preview");
  const status = $("#status");
  const albumSelect = $("#album");
  const newAlbum = $("#newAlbum");
  const newAlbumDesc = $("#newAlbumDesc");
  const createAlbumBtn = $("#createAlbum");
  const filterAlbum = $("#filterAlbum");
  const photoList = $("#photoList");
  let albumList = [];

  let busy = false;
  let previewUrl = null;
  let authCheckVersion = 0;

  function message(text, type = "info") {
    status.textContent = text;
    status.className = type;
  }

  function showLogin() {
    loginSection.hidden = false;
    manager.hidden = true;
  }

  function showManager() {
    loginSection.hidden = true;
    manager.hidden = false;
    loadAlbums();
  }

  // ==========================================
  // CONFIGURATION CHECK
  // ==========================================

  if (!window.supabase) {
    message(
      "Supabase failed to load. Check your internet connection and reload.",
      "error"
    );
    return;
  }

  if (
    !SUPABASE_URL.startsWith("https://") ||
    SUPABASE_URL.includes("YOUR_") ||
    SUPABASE_KEY.includes("YOUR_") ||
    SUPABASE_KEY === "" ||
    OWNER_ID.includes("YOUR_") ||
    OWNER_ID === ""
  ) {
    message(
      "Setup required: enter your Supabase project URL, public key, and actual admin UUID in the configuration section.",
      "error"
    );
    return;
  }

  const UUID_PATTERN =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  if (!UUID_PATTERN.test(OWNER_ID)) {
    message(
      "Configuration error: OWNER_ID must be a valid Supabase user UUID.",
      "error"
    );
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // ==========================================
  // ALBUMS
  // ==========================================

  async function loadAlbums(selectId) {
    const keep = selectId ?? albumSelect.value;

    const { data, error } = await db
      .from("albums")
      .select("id, title")
      .order("created_at", { ascending: true });

    if (error) {
      message(
        "Could not load albums: " + error.message +
        " (have you run albums-setup.sql in Supabase?)",
        "error"
      );
      return;
    }

    albumList = data || [];
    const keepFilter = filterAlbum.value;

    albumSelect.replaceChildren(new Option("No album", ""));
    filterAlbum.replaceChildren(
      new Option("All photos", ""),
      new Option("Not in an album", "none")
    );

    albumList.forEach((a) => {
      albumSelect.add(new Option(a.title, a.id));
      filterAlbum.add(new Option(a.title, a.id));
    });

    albumSelect.value = String(keep ?? "");
    filterAlbum.value = keepFilter;

    loadPhotos();
  }

  // ==========================================
  // MANAGE PHOTOS (edit, move, delete)
  // ==========================================

  async function loadPhotos() {
    const f = filterAlbum.value;

    let query = db
      .from("photos")
      .select("id, image_url, caption, location, album_id")
      .order("id", { ascending: false });

    if (f === "none") query = query.is("album_id", null);
    else if (f) query = query.eq("album_id", Number(f));

    const { data, error } = await query;

    if (error) {
      message("Could not load photos: " + error.message, "error");
      return;
    }

    photoList.replaceChildren();

    if (!data.length) {
      const empty = document.createElement("p");
      empty.textContent = "No photos here yet.";
      photoList.appendChild(empty);
      return;
    }

    data.forEach((p) => photoList.appendChild(photoRow(p)));
  }

  function textField(value, placeholder) {
    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 150;
    input.value = value || "";
    input.placeholder = placeholder;
    return input;
  }

  function photoRow(p) {
    const row = document.createElement("div");
    row.className = "photo-row";

    const img = document.createElement("img");
    img.src = p.image_url;
    img.alt = p.caption || "Photo";
    img.loading = "lazy";

    const cap = textField(p.caption, "Caption");
    const loc = textField(p.location, "Location");

    const sel = document.createElement("select");
    sel.add(new Option("No album", ""));
    albumList.forEach((a) => sel.add(new Option(a.title, a.id)));
    sel.value = p.album_id == null ? "" : String(p.album_id);

    const btns = document.createElement("div");
    btns.className = "btns";

    const save = document.createElement("button");
    save.type = "button";
    save.textContent = "Save";

    const del = document.createElement("button");
    del.type = "button";
    del.textContent = "Delete";
    del.className = "danger";

    btns.append(save, del);
    row.append(img, cap, loc, sel, btns);

    save.addEventListener("click", async () => {
      save.disabled = true;

      const { data, error } = await db
        .from("photos")
        .update({
          caption: cap.value.trim(),
          location: loc.value.trim(),
          album_id: sel.value ? Number(sel.value) : null
        })
        .eq("id", p.id)
        .select("id");

      if (error || !data || !data.length) {
        message(
          "Save failed: " + (error ? error.message : "no permission. Run photos-manage.sql in Supabase."),
          "error"
        );
      } else {
        message("Saved.", "success");
      }

      save.disabled = false;
    });

    del.addEventListener("click", async () => {
      if (!confirm("Delete this photo permanently? This cannot be undone.")) return;

      del.disabled = true;

      const { data, error } = await db
        .from("photos")
        .delete()
        .eq("id", p.id)
        .select("id");

      if (error || !data || !data.length) {
        message(
          "Delete failed: " + (error ? error.message : "no permission. Run photos-manage.sql in Supabase."),
          "error"
        );
        del.disabled = false;
        return;
      }

      // Also remove the file so it stops using your storage space
      const marker = "/object/public/" + BUCKET + "/";
      const at = p.image_url.indexOf(marker);
      let fileGone = false;

      if (at !== -1) {
        const filePath = decodeURIComponent(p.image_url.slice(at + marker.length));
        const { data: removed, error: fileError } = await db.storage
          .from(BUCKET)
          .remove([filePath]);
        fileGone = !fileError && removed && removed.length > 0;
      }

      row.remove();

      message(
        fileGone
          ? "Photo deleted."
          : "Photo removed from the gallery, but its file could not be deleted from storage (check the storage delete policy in photos-manage.sql).",
        fileGone ? "success" : "error"
      );
    });

    return row;
  }

  filterAlbum.addEventListener("change", loadPhotos);

  async function createAlbum() {
    const title = newAlbum.value.trim();

    if (!title) {
      message("Enter an album title.", "error");
      return;
    }

    createAlbumBtn.disabled = true;

    try {
      const user = await getAuthorizedUser();
      if (!user) throw new Error("Please log in again.");

      const { data, error } = await db
        .from("albums")
        .insert({ title, description: newAlbumDesc.value.trim() })
        .select("id")
        .single();

      if (error) throw error;

      newAlbum.value = "";
      newAlbumDesc.value = "";
      await loadAlbums(data.id);

      message(`Album "${title}" created and selected.`, "success");
    } catch (error) {
      message(
        "Could not create album: " + (error.message || "Unknown error"),
        "error"
      );
    } finally {
      createAlbumBtn.disabled = false;
    }
  }

  createAlbumBtn.addEventListener("click", createAlbum);

  // Enter in these boxes creates the album instead of submitting the photo form
  [newAlbum, newAlbumDesc].forEach((input) =>
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        createAlbum();
      }
    })
  );

  // ==========================================
  // SHOW / HIDE PASSWORD
  // This works independently of authentication.
  // ==========================================

  function setPasswordVisibility(visible) {
    passwordInput.type = visible ? "text" : "password";
    togglePassword.textContent = visible ? "Hide" : "Show";
    togglePassword.setAttribute(
      "aria-pressed",
      visible ? "true" : "false"
    );
  }

  togglePassword.addEventListener("click", () => {
    const shouldReveal = passwordInput.type === "password";
    setPasswordVisibility(shouldReveal);
  });

  // ==========================================
  // AUTHORIZATION
  // ==========================================

  async function getAuthorizedUser() {
    const { data, error } = await db.auth.getUser();

    if (error) {
      throw error;
    }

    const user = data.user;

    if (!user || user.id !== OWNER_ID) {
      return null;
    }

    return user;
  }

  async function refreshSession() {
    const version = ++authCheckVersion;

    try {
      const user = await getAuthorizedUser();

      // Ignore stale checks if a newer check has started.
      if (version !== authCheckVersion) return;

      if (user) {
        showManager();
        passwordInput.value = "";
        setPasswordVisibility(false);
      } else {
        showLogin();
      }
    } catch (error) {
      if (version !== authCheckVersion) return;

      showLogin();
      message(
        "Unable to verify your login: " +
        (error.message || "Unknown authentication error"),
        "error"
      );
    }
  }

  // ==========================================
  // LOGIN
  // ==========================================

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (busy) return;

    busy = true;
    loginButton.disabled = true;
    message("Signing in...", "info");

    try {
      const email = $("#email").value.trim();
      const password = passwordInput.value;

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw error;
      }

      const user = await getAuthorizedUser();

      if (!user) {
        await db.auth.signOut();
        throw new Error(
          "This account is not authorized as the gallery administrator. Check OWNER_ID."
        );
      }

      showManager();
      passwordInput.value = "";
      setPasswordVisibility(false);

      message(
        "Login successful. You can now upload photos.",
        "success"
      );
    } catch (error) {
      showLogin();

      message(
        "Login failed: " + (error.message || "Unknown error"),
        "error"
      );
    } finally {
      busy = false;
      loginButton.disabled = false;
    }
  });

  // ==========================================
  // IMAGE PREVIEW
  // ==========================================

  fileInput.addEventListener("change", () => {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    const file = fileInput.files[0];

    preview.hidden = true;
    preview.removeAttribute("src");

    if (!file) return;

    previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    preview.hidden = false;
  });

  // ==========================================
  // UPLOAD PHOTO
  // ==========================================

  uploadForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (busy) return;

    const files = [...fileInput.files];

    if (!files.length) {
      message("Please select an image.", "error");
      return;
    }

    const extensions = { "image/webp": "webp", "image/jpeg": "jpg", "image/png": "png" };

    for (const f of files) {
      if (!extensions[f.type]) {
        message(`"${f.name}" is not a WebP, JPEG, or PNG image.`, "error");
        return;
      }
      if (f.size > MAX_FILE_SIZE) {
        message(`"${f.name}" is larger than 5 MB.`, "error");
        return;
      }
    }

    const caption = $("#caption").value.trim();
    const location = $("#location").value.trim();

    if (!caption && files.length === 1) {
      message("Please enter a photo caption.", "error");
      return;
    }

    const albumId = albumSelect.value ? Number(albumSelect.value) : null;

    busy = true;
    publishButton.disabled = true;

    let done = 0;

    try {
      const user = await getAuthorizedUser();

      if (!user) {
        await db.auth.signOut();
        showLogin();
        throw new Error("Your administrator session is invalid. Please log in again.");
      }

      for (const file of files) {
        message(`Uploading ${done + 1} of ${files.length}...`, "info");

        // The user UUID folder matches the Storage policy.
        const path = `${user.id}/${crypto.randomUUID()}.${extensions[file.type]}`;

        const { error: uploadError } = await db.storage
          .from(BUCKET)
          .upload(path, file, { contentType: file.type, cacheControl: "3600", upsert: false });

        if (uploadError) throw uploadError;

        const { data: urlData } = db.storage.from(BUCKET).getPublicUrl(path);

        const { error: insertError } = await db
          .from("photos")
          .insert({ image_url: urlData.publicUrl, caption, location, album_id: albumId });

        if (insertError) {
          await db.storage.from(BUCKET).remove([path]); // don't leave an orphan file
          throw insertError;
        }

        done++;
      }

      // Keep the chosen album selected so you can upload another batch
      const keepAlbum = albumSelect.value;
      uploadForm.reset();
      albumSelect.value = keepAlbum;

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
      preview.removeAttribute("src");
      preview.hidden = true;

      message(`${done} photo${done === 1 ? "" : "s"} published!`, "success");
      loadPhotos();
    } catch (error) {
      message(
        `Upload stopped after ${done} of ${files.length}: ` + (error.message || "Unknown error"),
        "error"
      );
      if (done) loadPhotos();
    } finally {
      busy = false;
      publishButton.disabled = false;
    }
  });

  // ==========================================
  // LOGOUT
  // ==========================================

  $("#logoutButton").addEventListener("click", async () => {
    if (busy) return;

    busy = true;
    $("#logoutButton").disabled = true;

    try {
      const { error } = await db.auth.signOut();

      if (error) {
        throw error;
      }

      loginForm.reset();
      uploadForm.reset();

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      preview.removeAttribute("src");
      preview.hidden = true;

      setPasswordVisibility(false);
      showLogin();

      message("You have been logged out.", "success");
    } catch (error) {
      message(
        "Logout failed: " + (error.message || "Unknown error"),
        "error"
      );
    } finally {
      busy = false;
      $("#logoutButton").disabled = false;
    }
  });

  // ==========================================
  // SESSION RESTORATION
  // ==========================================

  db.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_IN" || event === "SIGNED_OUT") {
      // Schedule the session check outside the auth callback.
      setTimeout(() => {
        refreshSession();
      }, 0);
    }
  });

  // Start with a session check.
  refreshSession();
})();
</script>
</body>
</html>
