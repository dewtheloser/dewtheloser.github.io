
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>Gallery Admin — SEE THE WORLD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10110f;
      --panel: #191a17;
      --text: #f3f0e8;
      --muted: #a4a49a;
      --accent: #d3e0ad;
      --border: #55574f;
      --danger: #ffaaa0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: var(--bg);
      color: var(--text);
      font: 15px Arial, sans-serif;
    }

    main {
      max-width: 600px;
      margin: 40px auto;
    }

    h1 {
      font-size: 30px;
      letter-spacing: 1px;
    }

    h2 {
      margin-top: 28px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input,
    button {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 5px;
      font: inherit;
    }

    input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    input:focus,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      background: var(--accent);
      color: var(--bg);
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .password-wrap {
      display: flex;
      align-items: stretch;
      gap: 8px;
      width: 100%;
    }

    .password-wrap input {
      flex: 1;
      min-width: 0;
    }

    .password-wrap button {
      flex: 0 0 88px;
      width: 88px;
      margin: 10px 0;
      padding: 10px 5px;
    }

    .secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin: 15px 0;
      border-radius: 5px;
    }

    #status {
      min-height: 24px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #status.error {
      color: var(--danger);
    }

    #status.success {
      color: var(--accent);
    }

    #status.info {
      color: var(--muted);
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
<main>
  <h1>SEE THE WORLD.</h1>
  <p>Private gallery management</p>

  <!-- LOGIN -->
  <section id="loginSection">
    <h2>Admin login</h2>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Your admin email"
        required
      >

      <label for="password">Password</label>

      <div class="password-wrap">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Your password"
          required
        >

        <button
          id="togglePassword"
          class="secondary"
          type="button"
          aria-controls="password"
          aria-pressed="false"
        >Show</button>
      </div>

      <button id="loginButton" type="submit">
        Log in
      </button>
    </form>

    <p class="hint">
      Only the authorized administrator can access the gallery manager.
    </p>
  </section>

  <!-- ADMIN MANAGER -->
  <section id="manager" hidden>
    <h2>Upload a photo</h2>

    <form id="uploadForm">
      <label for="file">Choose an image</label>
      <input
        id="file"
        type="file"
        accept="image/webp,image/jpeg,image/png"
        required
      >

      <img id="preview" alt="Selected image preview" hidden>

      <label for="caption">Photo caption</label>
      <input
        id="caption"
        type="text"
        maxlength="150"
        placeholder="Photo caption"
        required
      >

      <label for="location">Location (optional)</label>
      <input
        id="location"
        type="text"
        maxlength="150"
        placeholder="Location"
      >

      <button id="publishButton" type="submit">
        Publish to gallery
      </button>
    </form>

    <button id="logoutButton" class="secondary" type="button">
      Log out
    </button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";

  // ==========================================
  // CONFIGURATION — UPDATE THESE THREE VALUES
  // ==========================================

  const SUPABASE_URL = "https://ddoidhdmbzvdnihysulj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_El35FFjl02a87rBYo8IzMg_lNRJFDL3";
  const OWNER_ID = "f34e5a07-d7ca-4464-84a7-92583b1cc449";

  const BUCKET = "gallery";
  const MAX_FILE_SIZE = 5 * 1024 * 1024;

  // ==========================================
  // PAGE ELEMENTS
  // ==========================================

  const $ = (selector) => document.querySelector(selector);

  const loginSection = $("#loginSection");
  const loginForm = $("#loginForm");
  const loginButton = $("#loginButton");
  const manager = $("#manager");
  const uploadForm = $("#uploadForm");
  const publishButton = $("#publishButton");
  const passwordInput = $("#password");
  const togglePassword = $("#togglePassword");
  const fileInput = $("#file");
  const preview = $("#preview");
  const status = $("#status");

  let busy = false;
  let previewUrl = null;
  let authCheckVersion = 0;

  function message(text, type = "info") {
    status.textContent = text;
    status.className = type;
  }

  function showLogin() {
    loginSection.hidden = false;
    manager.hidden = true;
  }

  function showManager() {
    loginSection.hidden = true;
    manager.hidden = false;
  }

  // ==========================================
  // CONFIGURATION CHECK
  // ==========================================

  if (!window.supabase) {
    message(
      "Supabase failed to load. Check your internet connection and reload.",
      "error"
    );
    return;
  }

  if (
    !SUPABASE_URL.startsWith("https://") ||
    SUPABASE_URL.includes("YOUR_") ||
    SUPABASE_KEY.includes("YOUR_") ||
    SUPABASE_KEY === "" ||
    OWNER_ID.includes("YOUR_") ||
    OWNER_ID === ""
  ) {
    message(
      "Setup required: enter your Supabase project URL, public key, and actual admin UUID in the configuration section.",
      "error"
    );
    return;
  }

  const UUID_PATTERN =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  if (!UUID_PATTERN.test(OWNER_ID)) {
    message(
      "Configuration error: OWNER_ID must be a valid Supabase user UUID.",
      "error"
    );
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // ==========================================
  // SHOW / HIDE PASSWORD
  // This works independently of authentication.
  // ==========================================

  function setPasswordVisibility(visible) {
    passwordInput.type = visible ? "text" : "password";
    togglePassword.textContent = visible ? "Hide" : "Show";
    togglePassword.setAttribute(
      "aria-pressed",
      visible ? "true" : "false"
    );
  }

  togglePassword.addEventListener("click", () => {
    const shouldReveal = passwordInput.type === "password";
    setPasswordVisibility(shouldReveal);
  });

  // ==========================================
  // AUTHORIZATION
  // ==========================================

  async function getAuthorizedUser() {
    const { data, error } = await db.auth.getUser();

    if (error) {
      throw error;
    }

    const user = data.user;

    if (!user || user.id !== OWNER_ID) {
      return null;
    }

    return user;
  }

  async function refreshSession() {
    const version = ++authCheckVersion;

    try {
      const user = await getAuthorizedUser();

      // Ignore stale checks if a newer check has started.
      if (version !== authCheckVersion) return;

      if (user) {
        showManager();
        passwordInput.value = "";
        setPasswordVisibility(false);
      } else {
        showLogin();
      }
    } catch (error) {
      if (version !== authCheckVersion) return;

      showLogin();
      message(
        "Unable to verify your login: " +
        (error.message || "Unknown authentication error"),
        "error"
      );
    }
  }

  // ==========================================
  // LOGIN
  // ==========================================

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (busy) return;

    busy = true;
    loginButton.disabled = true;
    message("Signing in...", "info");

    try {
      const email = $("#email").value.trim();
      const password = passwordInput.value;

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw error;
      }

      const user = await getAuthorizedUser();

      if (!user) {
        await db.auth.signOut();
        throw new Error(
          "This account is not authorized as the gallery administrator. Check OWNER_ID."
        );
      }

      showManager();
      passwordInput.value = "";
      setPasswordVisibility(false);

      message(
        "Login successful. You can now upload photos.",
        "success"
      );
    } catch (error) {
      showLogin();

      message(
        "Login failed: " + (error.message || "Unknown error"),
        "error"
      );
    } finally {
      busy = false;
      loginButton.disabled = false;
    }
  });

  // ==========================================
  // IMAGE PREVIEW
  // ==========================================

  fileInput.addEventListener("change", () => {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    const file = fileInput.files[0];

    preview.hidden = true;
    preview.removeAttribute("src");

    if (!file) return;

    previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    preview.hidden = false;
  });

  // ==========================================
  // UPLOAD PHOTO
  // ==========================================

  uploadForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (busy) return;

    const file = fileInput.files[0];

    if (!file) {
      message("Please select an image.", "error");
      return;
    }

    const allowedTypes = [
      "image/webp",
      "image/jpeg",
      "image/png"
    ];

    if (!allowedTypes.includes(file.type)) {
      message(
        "Unsupported file type. Choose a WebP, JPEG, or PNG image.",
        "error"
      );
      return;
    }

    if (file.size > MAX_FILE_SIZE) {
      message(
        "Image is too large. Choose a file smaller than 5 MB.",
        "error"
      );
      return;
    }

    const caption = $("#caption").value.trim();
    const location = $("#location").value.trim();

    if (!caption) {
      message("Please enter a photo caption.", "error");
      return;
    }

    busy = true;
    publishButton.disabled = true;

    let uploadedPath = null;

    try {
      message("Verifying administrator access...", "info");

      const user = await getAuthorizedUser();

      if (!user) {
        await db.auth.signOut();
        showLogin();

        throw new Error(
          "Your administrator session is invalid. Please log in again."
        );
      }

      const extensions = {
        "image/webp": "webp",
        "image/jpeg": "jpg",
        "image/png": "png"
      };

      const extension = extensions[file.type];

      // The user UUID folder matches the Storage policy.
      const path =
        `${user.id}/${crypto.randomUUID()}.${extension}`;

      message("Uploading image...", "info");

      const { error: uploadError } = await db.storage
        .from(BUCKET)
        .upload(path, file, {
          contentType: file.type,
          cacheControl: "3600",
          upsert: false
        });

      if (uploadError) {
        throw uploadError;
      }

      uploadedPath = path;

      const { data: urlData } = db.storage
        .from(BUCKET)
        .getPublicUrl(path);

      if (!urlData || !urlData.publicUrl) {
        throw new Error("Could not create the public image URL.");
      }

      message("Saving photo details...", "info");

      const { error: insertError } = await db
        .from("photos")
        .insert({
          image_url: urlData.publicUrl,
          caption,
          location
        });

      if (insertError) {
        throw insertError;
      }

      // The database record and image upload both succeeded.
      uploadedPath = null;

      uploadForm.reset();

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      preview.removeAttribute("src");
      preview.hidden = true;

      message("Photo published successfully!", "success");
    } catch (error) {
      // Clean up the file if the database insert failed.
      if (uploadedPath) {
        try {
          const { error: cleanupError } = await db.storage
            .from(BUCKET)
            .remove([uploadedPath]);

          if (cleanupError) {
            console.error("File cleanup failed:", cleanupError);
          }
        } catch (cleanupError) {
          console.error("File cleanup failed:", cleanupError);
        }
      }

      message(
        "Upload failed: " + (error.message || "Unknown error"),
        "error"
      );
    } finally {
      busy = false;
      publishButton.disabled = false;
    }
  });

  // ==========================================
  // LOGOUT
  // ==========================================

  $("#logoutButton").addEventListener("click", async () => {
    if (busy) return;

    busy = true;
    $("#logoutButton").disabled = true;

    try {
      const { error } = await db.auth.signOut();

      if (error) {
        throw error;
      }

      loginForm.reset();
      uploadForm.reset();

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      preview.removeAttribute("src");
      preview.hidden = true;

      setPasswordVisibility(false);
      showLogin();

      message("You have been logged out.", "success");
    } catch (error) {
      message(
        "Logout failed: " + (error.message || "Unknown error"),
        "error"
      );
    } finally {
      busy = false;
      $("#logoutButton").disabled = false;
    }
  });

  // ==========================================
  // SESSION RESTORATION
  // ==========================================

  db.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_IN" || event === "SIGNED_OUT") {
      // Schedule the session check outside the auth callback.
      setTimeout(() => {
        refreshSession();
      }, 0);
    }
  });

  // Start with a session check.
  refreshSession();
})();
</script>
</body>
</html>
